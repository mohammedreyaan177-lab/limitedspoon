<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1F2C" />
    <title>Limited Spoon Wellness — Nutritional &amp; Dietetic Centre</title>
    <meta
      name="description"
      content="Limited Spoon Wellness is a nutritional and dietetic centre offering personalised nutrition care — weight management, PCOS, diabetes, pre &amp; post-natal, geriatric and cardiopulmonary nutrition, guided by a clinical &amp; wellness nutritionist."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-latin.woff2" crossorigin />
    <script>
      /* Runs before first paint. Browsers restore the previous scroll offset on
         refresh, which would land the visitor halfway down the page they were
         on — and would race the brand intro. Opting out here means the
         decision is made before layout, not after it. */
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      window.scrollTo(0, 0);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
